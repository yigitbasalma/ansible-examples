---
# Sunucuyu sıkılaştırır, ardından nginx rolünü kurar. AWX job template'inde
# Playbook: playbooks/nginx.yml
#
# Rollerin parametreleri extra vars ya da survey ile verilir; adları
# çakışmaz:
#   el_hardening (roles/el_hardening/meta/argument_specs.yml): ip_forward,
#     selinux_state, crypto_policy, ssh_root_login, ...
#   nginx (roles/nginx/meta/argument_specs.yml): server_name, listen_port,
#     root, worker_processes.
# Hedef host'lar inventory ve job template'in "Limit" alanıyla seçilir.
# Sıkılaştırma bir host'ta düşerse o host'a nginx kurulmaz.
- name: nginx
  hosts: all
  become: true
  vars:
    # Rolün şablonları dosyanın başına kimin yazdığını koyar. Job ID'si
    # değil template adı: her run'da dosya değişip nginx reload olmasın.
    gaia_contract: "AWX: {{ awx_job_template_name | default('elle çalıştırıldı') }}"
  roles:
    - role: el_hardening
    - role: nginx
