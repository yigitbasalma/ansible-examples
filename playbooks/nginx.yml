---
# nginx rolünü kurar. AWX job template'inde Playbook: playbooks/nginx.yml
#
# Rolün parametreleri (roles/nginx/meta/argument_specs.yml) extra vars ya da
# survey ile verilir: server_name, listen_port, root, worker_processes.
# Hedef host'lar inventory ve job template'in "Limit" alanıyla seçilir.
- name: nginx
  hosts: all
  become: true
  vars:
    # Rolün şablonları dosyanın başına kimin yazdığını koyar. Job ID'si
    # değil template adı: her run'da dosya değişip nginx reload olmasın.
    gaia_contract: "AWX: {{ awx_job_template_name | default('elle çalıştırıldı') }}"
  roles:
    - role: nginx
