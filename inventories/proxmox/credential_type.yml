---
# AWX'te Proxmox için hazır credential tipi yok; bu tanımla eklenir.
# Administration > Credential Types > Add, Name: "Proxmox API"
#   Input configuration:    aşağıdaki "inputs" bloğunun içi
#   Injector configuration: aşağıdaki "injectors" bloğunun içi
# Sonra Resources > Credentials > Add ile bu tipte bir credential açılır ve
# inventory source'a bağlanır (pve.proxmox.yml).
#
# Proxmox tarafında (salt okuma yeterli):
#   pveum user add awx@pve
#   pveum user token add awx@pve awx --privsep 0
#   pveum acl modify / --users awx@pve --roles PVEAuditor
# Token komutunun çıktısındaki "value" Token secret'tır; bir daha gösterilmez.
# Guest agent'tan IP okunamıyorsa (ansible_host VM adına düşüyorsa) kullanıcıya
# agent sorgu yetkisi de verilmeli: PVE 8'de VM.Monitor, PVE 9'da
# VM.GuestAgent.Audit.
inputs:
  fields:
    - id: url
      label: Proxmox URL
      type: string
      help_text: Örn. https://pve01.example.local:8006
    - id: user
      label: Kullanıcı
      type: string
      help_text: Realm ile birlikte, örn. awx@pve
    - id: token_id
      label: Token ID
      type: string
      help_text: Sadece token adı, örn. awx (awx@pve!awx değil)
    - id: token_secret
      label: Token secret
      type: string
      secret: true
    - id: ca_cert
      label: CA certificate
      type: string
      multiline: true
      help_text: Proxmox sertifikası self-signed ise CA'nın PEM içeriği; boş bırakılabilir.
  required:
    - url
    - user
    - token_id
    - token_secret
injectors:
  env:
    PROXMOX_URL: "{{ url }}"
    PROXMOX_USER: "{{ user }}"
    PROXMOX_TOKEN_ID: "{{ token_id }}"
    PROXMOX_TOKEN_SECRET: "{{ token_secret }}"
    # Eklenti requests kullanır; requests bu değişkendeki CA ile doğrular.
    REQUESTS_CA_BUNDLE: "{{ tower.filename if ca_cert | default('') else '' }}"
  file:
    template: "{{ ca_cert | default('') }}"
