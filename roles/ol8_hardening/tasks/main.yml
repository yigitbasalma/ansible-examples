---
- name: Hedef Oracle Linux 8 mi?
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'OracleLinux'
      - ansible_facts.distribution_major_version == '8'
    fail_msg: Bu rol yalnızca Oracle Linux 8 içindir ({{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} bulundu).
    quiet: true

# Hiçbir şey değişmeden önce: aksi halde bir sonraki run'da erişim kaybedilir.
- name: root girişi kapatılırken Ansible root ile bağlanmıyor
  ansible.builtin.assert:
    that: not (ssh_hardening and ssh_root_login == 'no' and (ansible_user | default('')) == 'root')
    fail_msg: ssh_root_login "no" iken Ansible root ile bağlanıyor; bir sonraki run'da sunucuya erişilemez.
    quiet: true

- name: Kernel
  ansible.builtin.import_tasks: kernel.yml

- name: Dosya sistemi
  ansible.builtin.import_tasks: filesystem.yml

- name: Paketler ve servisler
  ansible.builtin.import_tasks: packages.yml

- name: SELinux ve kripto politikası
  ansible.builtin.import_tasks: security.yml

- name: Parola, oturum ve banner
  ansible.builtin.import_tasks: auth.yml

- name: sshd
  ansible.builtin.import_tasks: ssh.yml
  when: ssh_hardening
