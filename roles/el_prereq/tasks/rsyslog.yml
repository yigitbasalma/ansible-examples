---
- name: TLS yalnızca tcp ile
  ansible.builtin.assert:
    that: not (rsyslog_tls | bool and rsyslog_remote_protocol == 'udp')
    fail_msg: rsyslog_tls udp ile kullanılamaz; rsyslog_remote_protocol tcp olmalı.
    quiet: true

- name: rsyslog
  ansible.builtin.dnf:
    name: "{{ ['rsyslog'] + (['rsyslog-gnutls'] if rsyslog_tls | bool else []) }}"
    state: present
  register: rsyslog_packages

- name: TLS CA dosyası
  ansible.builtin.stat:
    path: "{{ rsyslog_tls_ca_file }}"
  register: rsyslog_ca
  when: rsyslog_tls | bool and rsyslog_remote_host | length > 0

- name: TLS CA dosyası sunucuda var mı?
  ansible.builtin.assert:
    that: rsyslog_ca.stat.exists
    fail_msg: rsyslog_tls açık ama CA dosyası yok ({{ rsyslog_tls_ca_file }}); rol CA dağıtmaz.
    quiet: true
  when: rsyslog_ca is not skipped

- name: Merkezi log sunucusuna iletim
  ansible.builtin.template:
    src: rsyslog-forward.conf.j2
    dest: /etc/rsyslog.d/60-gaia-forward.conf
    mode: "0644"
    validate: rsyslogd -N1 -f %s
  register: rsyslog_forward
  when: rsyslog_remote_host | length > 0

- name: İletim kapalı
  ansible.builtin.file:
    path: /etc/rsyslog.d/60-gaia-forward.conf
    state: absent
  register: rsyslog_forward_removed
  when: rsyslog_remote_host | length == 0

# SELinux rsyslog'un (syslogd_t) yalnızca belirli port tiplerine TCP ile
# bağlanmasına izin verir; 514, 601, 6514 gibi portlar hazırdır, 1514 gibi
# genel aralıktaki bir port engellenir ve loglar sessizce gitmez. UDP'de
# hedef port denetlenmez.
- name: SELinux
  when:
    - rsyslog_remote_host | length > 0
    - rsyslog_remote_protocol == 'tcp'
  block:
    # ansible_facts.selinux OL8'de okunamaz (python3.12 için libselinux yok).
    - name: SELinux durumu
      ansible.builtin.command: getenforce
      register: rsyslog_selinux
      changed_when: false
      failed_when: false
      check_mode: false

    - name: İletim portu
      when: rsyslog_selinux.rc == 0 and rsyslog_selinux.stdout != 'Disabled'
      block:
        - name: SELinux araçları (semanage)
          ansible.builtin.dnf:
            name: policycoreutils-python-utils
            state: present
          register: rsyslog_semanage_package

        # Check mode'da semanage henüz kurulmadıysa sorgulanamaz.
        - name: İletim portunun SELinux etiketleri
          ansible.builtin.shell: >-
            set -o pipefail;
            semanage port -l | awk -v p={{ rsyslog_remote_port }} '$2 == "tcp" {
              for (i = 3; i <= NF; i++) { gsub(",", "", $i); n = split($i, r, "-");
                if ((n == 1 && r[1] == p) || (n == 2 && p >= r[1] + 0 && p <= r[2] + 0)) print $1 } }'
          register: rsyslog_port_types
          changed_when: false
          check_mode: false
          when: not (ansible_check_mode and rsyslog_semanage_package is changed)

        # Genel tipler (unreserved_port_t vb.) bir aralığı kaplar; tek port
        # onların üstüne etiketlenebilir. Başka bir servisin portu alınmaz.
        - name: İletim portu başka bir servise ait değil
          ansible.builtin.assert:
            that: >-
              types | intersect(rsyslog_selinux_allowed_port_types) | length > 0
              or types | difference(selinux_generic_port_types) | length == 0
            fail_msg: >-
              tcp/{{ rsyslog_remote_port }} SELinux'ta başka bir servise ait ({{ types | join(', ') }}); rsyslog oraya
              bağlanamaz. Log sunucusunda başka bir port kullanın ya da etiketi elle düzenleyin.
            quiet: true
          vars:
            types: "{{ rsyslog_port_types.stdout_lines | default([]) }}"
          when: rsyslog_port_types is not skipped

        - name: İletim portu rsyslog'a etiketlensin
          ansible.builtin.command: >-
            semanage port -a -t {{ 'syslog_tls_port_t' if rsyslog_tls | bool else 'syslogd_port_t' }}
            -p tcp {{ rsyslog_remote_port }}
          register: rsyslog_port_labeled
          changed_when: true
          when:
            - rsyslog_port_types is not skipped
            - rsyslog_port_types.stdout_lines | intersect(rsyslog_selinux_allowed_port_types) | length == 0

# Check mode'da rsyslog henüz kurulmadıysa servis yoktur.
- name: rsyslog servisi
  when: not (ansible_check_mode and rsyslog_packages is changed)
  block:
    - name: rsyslog açılışta başlasın ve çalışsın
      ansible.builtin.systemd_service:
        name: rsyslog
        enabled: true
        state: started
      register: rsyslog_started

    # Tüm ayar (rsyslog.conf ve rsyslog.d) geçerli değilse yeniden
    # başlatılmaz; rsyslog'un reload'u yoktur.
    - name: rsyslog ayarları geçerli mi?
      ansible.builtin.command: rsyslogd -N1
      changed_when: false
      when: rsyslog_forward is changed or rsyslog_forward_removed is changed

    # Etiket sonradan verildiyse rsyslog bağlantıyı yeniden dener; yine de
    # beklememek için yeniden başlatılır.
    - name: rsyslog yeni ayarla yeniden başlasın
      ansible.builtin.systemd_service:
        name: rsyslog
        state: restarted
      when:
        - rsyslog_forward is changed or rsyslog_forward_removed is changed or rsyslog_port_labeled is changed
        - rsyslog_started is not changed
