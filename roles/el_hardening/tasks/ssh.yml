---
# sshd her ayarın ilk değerini kullanır; blok dosyanın başında olduğu
# için aşağıdaki varsayılan satırlar ve Match blokları onu ezemez.
- name: sshd ayarları
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    insertbefore: BOF
    marker: "# {mark} Gaia sıkılaştırma"
    block: |
      {% for key, value in sshd_baseline.items() %}
      {{ key }} {{ value }}
      {% endfor %}
    validate: /usr/sbin/sshd -t -f %s
  notify: sshd changed
