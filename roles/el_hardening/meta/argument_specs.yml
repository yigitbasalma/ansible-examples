---
argument_specs:
  main:
    short_description: Oracle Linux 8 ve Rocky Linux 9 sunucuyu CIS benzeri bir temel sıkılaştırma seviyesine getirir
    description:
      - Kernel parametreleri, kernel modülleri, geçici dizinlerin bağlama seçenekleri, gereksiz paket ve servisler,
        SELinux, kripto politikası, parola/kilitleme politikası, umask, banner ve sshd ayarlarını düzenler.
      - Check mode'da hiçbir şeyi değiştirmeden sapmaları raporlar.
      - Bazı ayarlar (SELinux disabled'dan açılırsa, kernel modülleri, kripto politikası) yeniden başlatmadan sonra tam etkinleşir;
        rol sunucuyu kendisi yeniden başlatmaz.
    options:
      ip_forward:
        type: bool
        default: false
        description: IP yönlendirme açık kalsın. Container (podman/k8s) veya router görevi gören sunucularda true olmalı.
      disabled_kernel_modules:
        type: list
        elements: str
        default: [cramfs, freevxfs, jffs2, hfs, hfsplus, squashfs, udf, usb-storage]
        description: Yüklenmesi engellenen kernel modülleri. vfat'ı eklemeyin; UEFI'li sunucularda /boot/efi onu kullanır.
      secure_mounts:
        type: list
        elements: path
        default: [/dev/shm, /tmp, /var/tmp]
        description: nodev,nosuid,noexec ile bağlanacak dizinler. Yalnızca ayrı bağlanmış olanlara uygulanır; fstab satırı yeniden yazılır.
      remove_packages:
        type: list
        elements: str
        default: [telnet-server, tftp-server, vsftpd, xinetd, ypserv, rsh-server, talk-server]
        description: Kaldırılacak paketler. Kurulu olmayanlar atlanır.
      disable_services:
        type: list
        elements: str
        default: [avahi-daemon, cups]
        description: Durdurulup maskelenecek servisler. Sunucuda olmayanlar atlanır.
      selinux_state:
        type: str
        default: enforcing
        choices: [enforcing, permissive]
        description: SELinux modu (targeted politika).
      crypto_policy:
        type: str
        default: DEFAULT
        choices: [DEFAULT, FUTURE]
        description: Sistem geneli kripto politikası. FUTURE eski istemcilerle (RSA < 3072, SHA-1) bağlantıyı keser.
      umask:
        type: str
        default: "027"
        description: Oturumların varsayılan umask'ı.
      pass_max_days:
        type: int
        default: 90
        description: Parolanın en fazla geçerlilik süresi (gün). Yalnızca yeni oluşturulan kullanıcılara uygulanır.
      pass_min_days:
        type: int
        default: 1
        description: İki parola değişikliği arasındaki en az süre (gün). Yalnızca yeni kullanıcılara uygulanır.
      pass_warn_age:
        type: int
        default: 7
        description: Parolanın süresi dolmadan kaç gün önce uyarılsın.
      pass_min_len:
        type: int
        default: 14
        description: En kısa parola uzunluğu (pwquality).
      faillock_deny:
        type: int
        default: 5
        description: Kaç hatalı girişten sonra hesap kilitlensin.
      faillock_unlock_time:
        type: int
        default: 900
        description: Kilitlenen hesap kaç saniye sonra açılsın; 0 yönetici açana kadar kilitli kalır.
      banner_text:
        type: str
        default: Bu sistem yalnızca yetkili kullanıcılar içindir. Tüm erişimler kayıt altına alınır.
        description: Girişte gösterilen uyarı (/etc/issue, /etc/issue.net, /etc/motd ve SSH banner).
      ssh_hardening:
        type: bool
        default: true
        description: sshd ayarları da sıkılaştırılsın. Kullanıcı/anahtar yönetimi bu rolün işi değildir.
      ssh_root_login:
        type: str
        default: prohibit-password
        choices: ["no", prohibit-password]
        description: root'un SSH ile girişi. "no" seçilirse Ansible root dışında bir kullanıcıyla bağlanmalı.
      ssh_max_auth_tries:
        type: int
        default: 4
        description: Bir bağlantıda en fazla kimlik doğrulama denemesi.
      ssh_client_alive_interval:
        type: int
        default: 300
        description: Boştaki SSH oturumu kaç saniyede bir yoklansın; 3 cevapsız yoklamada oturum kapanır.
