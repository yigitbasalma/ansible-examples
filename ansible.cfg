[defaults]
# AWX playbook'u repo kökünden çalıştırır; playbooks/ altındakiler roles/'u
# buradan bulur.
roles_path = ./roles

# Ortam internete kapalı: collection'lar Galaxy'den çekilmez, repoda
# collections/ansible_collections altında durur (bkz.
# collections/requirements-vendor.yml).
collections_path = ./collections

# Yalnızca AWX inventory güncellemeleri için (ör. inventories/proxmox): AWX
# bunlarda yalnızca bu eski anahtarı okur ve komutu proje dizininden değil
# /runner'dan çalıştırır; göreli yol tutmaz. ansible-core bu anahtarı
# kullanmaz.
collections_paths = /runner/project/collections
